<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body { margin:0; padding:0; background:transparent; font:14px system-ui,sans-serif; color:#f8fafc; }
  /* Fallback if Streamlit's component iframe cannot access its parent DOM. */
  #warning { display:none; box-sizing:border-box; background:#192438; border:2px solid #f59e0b; border-radius:12px; padding:14px; width:100%; box-shadow:0 6px 18px #0003; }
  #warning strong { color:#fcd34d; font-size:16px; }
  #hint { margin:10px 0; }
  button { border:0; border-radius:7px; background:#2563eb; color:white; padding:9px 18px; cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<div id="warning" role="alertdialog" aria-live="assertive" aria-label="Inactivity warning">
  <strong>Session expiring</strong>
  <div id="hint"></div>
  <button id="stay" type="button">Stay Signed In</button>
</div>
<script>
'use strict';
const STORE = 'saas_dashboard_tab_lease_v2';
const TTL = 900000;     // 15 minutes
const WARNING = 720000; // Show warning after 12 minutes
const OVERLAY_ID = 'saas-idle-overlay-v1';

let token = '';
let args = {};
let idleSince = Date.now();
let lastEvent = 0;
let seq = 0;
let ready = false;
let warning = false;
let expired = false;
let lastAck = null;
let parentDocument = null;

const warningElement = document.getElementById('warning');
const hintElement = document.getElementById('hint');

function send(kind) {
  if (!ready) return;
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: 'streamlit:setComponentValue',
    dataType: 'json',
    value: { kind, token, nonce: `${Date.now()}-${++seq}` }
  }, '*');
}
function resize(height) {
  window.parent.postMessage({isStreamlitMessage:true, type:'streamlit:setFrameHeight', height}, '*');
}
function getToken() {
  try { return sessionStorage.getItem(STORE) || ''; }
  catch (_) { return ''; }
}
function putToken(t) {
  try { sessionStorage.setItem(STORE, t); }
  catch (_) {}
}
function clearToken() {
  token = '';
  try { sessionStorage.removeItem(STORE); }
  catch (_) {}
}

function getParentDocument() {
  try {
    const doc = window.parent.document;
    if (doc && doc.body) return doc;
  } catch (_) { /* Cross-origin or iframe sandbox */ }
  return null;
}
function overlayElement() {
  try { return parentDocument && parentDocument.getElementById(OVERLAY_ID); }
  catch (_) { return null; }
}
function removeOverlay() {
  const node = overlayElement();
  if (node) node.remove();
}
function createOverlay() {
  parentDocument = getParentDocument();
  if (!parentDocument) return null;
  let overlay = overlayElement();
  if (overlay) return overlay;

  overlay = parentDocument.createElement('div');
  overlay.id = OVERLAY_ID;
  overlay.setAttribute('role', 'presentation');
  Object.assign(overlay.style, {
    position: 'fixed', inset: '0', zIndex: '2147483000',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    padding: '20px', boxSizing: 'border-box',
    background: 'rgba(3, 7, 18, 0.78)',
    backdropFilter: 'blur(3px)', WebkitBackdropFilter: 'blur(3px)'
  });

  const modal = parentDocument.createElement('section');
  modal.setAttribute('role', 'alertdialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-label', 'Inactivity warning');
  Object.assign(modal.style, {
    width: 'min(440px, 100%)', maxHeight: '90vh', overflowY: 'auto',
    boxSizing: 'border-box', background: '#111b30', color: '#f8fafc',
    border: '1px solid #f59e0b', borderRadius: '16px',
    boxShadow: '0 24px 90px rgba(0,0,0,.55)', padding: '28px',
    font: '14px system-ui, sans-serif', textAlign: 'left'
  });

  const title = parentDocument.createElement('h2');
  title.textContent = 'Session expiring';
  Object.assign(title.style, {
    margin: '0 0 14px', fontSize: '21px', fontWeight: '700', color: '#fcd34d'
  });
  const description = parentDocument.createElement('p');
  description.id = 'saas-idle-modal-countdown';
  description.setAttribute('aria-live', 'off');
  Object.assign(description.style, {
    margin: '0 0 24px', lineHeight: '1.65', color: '#e2e8f0'
  });
  const stay = parentDocument.createElement('button');
  stay.type = 'button';
  stay.textContent = 'Stay Signed In';
  Object.assign(stay.style, {
    border: '0', borderRadius: '8px', background: '#2563eb',
    color: 'white', padding: '11px 20px', fontSize: '14px',
    fontWeight: '650', cursor: 'pointer'
  });
  stay.addEventListener('click', () => {
    if (!expired && warning) send('STAY');
    // Do not hide or reset countdown until server acknowledges STAY.
  });
  // Clicking outside the modal must never dismiss or renew it.
  overlay.addEventListener('pointerdown', ev => { if (ev.target === overlay) ev.preventDefault(); });
  modal.append(title, description, stay);
  overlay.append(modal);
  parentDocument.body.append(overlay);
  stay.focus();
  return overlay;
}
function hideWarning() {
  warning = false;
  removeOverlay();
  warningElement.style.display = 'none';
  resize(0);
}
function showWarning() {
  warning = true;
  const overlay = createOverlay();
  if (overlay) {
    // True full-viewport modal, independent of Streamlit component placement.
    warningElement.style.display = 'none';
    resize(0);
  } else {
    // Degraded browser mode: preserve the fully tested countdown/timeout.
    warningElement.style.display = 'block';
    resize(115);
  }
}
function updateCountdown(text) {
  hintElement.textContent = text;
  const overlay = overlayElement();
  if (overlay) {
    const hint = overlay.querySelector('#saas-idle-modal-countdown');
    if (hint) hint.textContent = text;
  }
}
function activity() {
  // Ordinary clicks/scrolling never dismiss a visible warning.
  if (!token || !args.authorized || expired || warning) return;
  idleSince = Date.now();
  if (Date.now() - lastEvent > 10000) {
    lastEvent = Date.now();
    send('ACTIVITY');
  }
}

window.addEventListener('message', ev => {
  if (!ev.data || ev.data.type !== 'streamlit:render') return;
  const next = ev.data.args || {};
  args = next;
  if (next.clear) {
    clearToken();
    expired = false;
    hideWarning();
    return;
  }
  if (next.issue && next.issue !== token) {
    token = next.issue;
    putToken(token);
    idleSince = Date.now();
    expired = false;
    hideWarning();
  }
  if (next.stay_ack && next.stay_ack !== lastAck) {
    lastAck = next.stay_ack;
    idleSince = Date.now();
    expired = false;
    hideWarning();
  }
  // Do not reset the clock on routine Streamlit rerenders.
  if (!ready) {
    ready = true;
    token = next.issue || getToken();
    if (next.issue) putToken(token);
    if (next.issue && typeof next.remaining_seconds === 'number') {
      const remainingMs = Math.max(0, Math.min(TTL, next.remaining_seconds * 1000));
      idleSince = Date.now() - (TTL - remainingMs);
    }
    lastAck = next.stay_ack || null;
    send('BOOT');
  }
});

window.parent.postMessage({
  isStreamlitMessage: true, type:'streamlit:componentReady', apiVersion:1
}, '*');
resize(0);

parentDocument = getParentDocument();
if (parentDocument) {
  ['pointerdown','keydown','wheel','touchstart'].forEach(eventName =>
    parentDocument.addEventListener(eventName, activity, {capture:true, passive:true})
  );
}
document.getElementById('stay').addEventListener('click', () => {
  if (!expired && warning) send('STAY');
});
window.addEventListener('pagehide', removeOverlay);

setInterval(() => {
  if (!token || !args.authorized || expired) return;
  const left = TTL - (Date.now() - idleSince);
  if (left <= 0) {
    expired = true;
    hideWarning();
    send('TIMEOUT');
    return;
  }
  if (left <= TTL - WARNING) {
    const seconds = Math.ceil(left / 1000);
    const minutes = Math.floor(seconds / 60);
    const secondsPart = String(seconds % 60).padStart(2, '0');
    updateCountdown(`You will be signed out in ${minutes}:${secondsPart} unless you select Stay Signed In.`);
    showWarning();
  }
}, 1000);
</script>
</body>
</html>
